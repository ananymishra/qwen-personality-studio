name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate personalities.json
        run: |
          python - <<'EOF'
          import json
          data = json.load(open('personalities.json', encoding='utf-8'))
          assert data['schema_version'] == '1.0', 'unexpected schema_version'
          ids = [p['id'] for p in data['personas']]
          assert len(ids) == len(set(ids)), 'duplicate persona ids in personalities.json'
          seen_pairs = set()
          for p in data['personas']:
              assert isinstance(p['layer'], int) and p['layer'] >= 0, f"bad layer in {p['id']}"
              assert isinstance(p['neuron'], int) and p['neuron'] >= 0, f"bad neuron in {p['id']}"
              assert p['category'] in ('persona', 'quirk', 'stack'), f"bad category in {p['id']}"
              assert p['mode'] == ('add' if p['dose'] >= 0 else 'sub'), f"dose/mode mismatch in {p['id']}"
              assert p['description'].strip(), f"empty description in {p['id']}"
              # extra_neurons: required + provenanced for stack entries, forbidden elsewhere
              ex = p.get('extra_neurons', [])
              if p['category'] == 'stack':
                  assert ex, f"stack entry without extra_neurons in {p['id']}"
                  assert p.get('evidence', '').strip(), f"stack entry without evidence provenance in {p['id']}"
                  for e in ex:
                      assert isinstance(e['layer'], int) and e['layer'] >= 0, f"bad extra layer in {p['id']}"
                      assert isinstance(e['neuron'], int) and e['neuron'] >= 0, f"bad extra neuron in {p['id']}"
                      assert e['mode'] == ('add' if e['dose'] >= 0 else 'sub'), f"extra dose/mode mismatch in {p['id']}"
              else:
                  assert not ex, f"{p['category']} entry with extra_neurons in {p['id']}"
              # screening is optional, but if present it must carry inline rates
              v = p.get('screening')
              if v is not None:
                  assert v.get('prompts') == 67, f"bad screening.prompts in {p['id']}"
                  for k in ('interest', 'drift', 'breadth', 'concept', 'coherent', 'degenerate'):
                      assert isinstance(v.get(k), (int, float)), f"missing screening.{k} in {p['id']}"
          print(f"OK: {len(ids)} personas")
          EOF

      - name: Validate verdicts.json
        run: |
          python - <<'EOF'
          import json
          v = json.load(open('verdicts.json', encoding='utf-8'))
          assert 'verdicts' in v and isinstance(v['verdicts'], list), 'verdicts key missing'
          for x in v['verdicts']:
              assert str(x.get('key', '')).strip(), 'verdict entry missing stack key'
              assert isinstance(x.get('good'), int) and x['good'] >= 0, 'bad good count'
              assert isinstance(x.get('bad'), int) and x['bad'] >= 0, 'bad bad count'
              assert x['good'] + x['bad'] > 0, 'verdict entry with no votes'
          print(f"OK: {len(v['verdicts'])} verdict entries")
          EOF

      - name: Compile all Python sources
        run: |
          python -m compileall -q qwen_steering scripts examples
          echo "compile OK"

      - name: CLI smoke test (no torch needed)
        run: |
          python -m qwen_steering --list > /dev/null
          python -m qwen_steering --show-payload --persona evil-qwen

      - name: Studio fallback data in sync?
        run: |
          python scripts/build_dataset.py
          if ! git diff --quiet -- personalities.json studio/embedded_data.js; then
            echo "::error::studio/embedded_data.js is out of sync with personalities.json - run 'python scripts/build_dataset.py' and commit the result"
            git diff -- personalities.json studio/embedded_data.js
            exit 1
          fi

      - name: Validate studio HTML/JS basics
        run: |
          python - <<'EOF'
          from pathlib import Path
          html = Path('studio/index.html').read_text(encoding='utf-8')
          for needle in ('embedded_data.js', 'masterPersonalities', 'personalities.json', 'switchView'):
              assert needle in html, f'studio/index.html missing {needle!r}'
          js = Path('studio/embedded_data.js').read_text(encoding='utf-8')
          assert js.startswith('// AUTO-GENERATED'), 'embedded_data.js must be generated by scripts/build_dataset.py'
          print('studio assets OK')
          EOF

  pages:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
